<div class="remove-margin">
  <div class="login-container">
    <div class="login-header">
      <h2>Login</h2>
    </div>
    <form class="login-form" #loginForm="ngForm" (ngSubmit)="onLoginClick(loginForm)" novalidate>
      <mat-form-field class="forms" appearance="outline">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          placeholder="Enter your Email"
          id="email"
          name="email"
          [(ngModel)]="user.email"
          required
          email
          #email="ngModel"
        />
        <mat-error *ngIf="email.invalid && (email.dirty || email.touched)">
          <span *ngIf="email.errors?.['required']">Email is required.</span>
          <span *ngIf="email.errors?.['email']">Enter a valid email.</span>
        </mat-error>
      </mat-form-field>

      <mat-form-field class="forms" appearance="outline">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          placeholder="Enter your Password"
          id="password"
          name="password"
          [(ngModel)]="user.password"
          required
          minlength="6"
          #password="ngModel"
        />
        <mat-error *ngIf="password.invalid && (password.dirty || password.touched)">
          <span *ngIf="password.errors?.['required']">Password is required.</span>
          <span *ngIf="password.errors?.['minlength']">
            Password must be at least 6 characters.
          </span>
        </mat-error>
      </mat-form-field>
      <button type="submit" class="login-button" [disabled]="loginForm.invalid">
        Login
      </button>
      <p class="register-link">
        Don't have an account? <a [routerLink]="['/register']">Register here</a>
      </p>
    </form>
  </div>
</div>

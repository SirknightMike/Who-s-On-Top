<div class="auth-page">
  <div class="auth-card">

    <div class="card-banner">
      <div class="banner-icon">
        <mat-icon>emoji_events</mat-icon>
      </div>
      <div class="banner-text">
        <h2>Welcome back</h2>
        <p>Sign in to your Who's On Top account</p>
      </div>
    </div>

    <form class="card-body" #loginForm="ngForm" (ngSubmit)="onLoginClick(loginForm)" novalidate>

      <div class="field-group">
        <label class="field-label">Email</label>
        <div class="field-wrap">
          <mat-icon class="field-icon">mail</mat-icon>
          <input
            class="field-input"
            matInput
            type="email"
            placeholder="you@example.com"
            name="email"
            [(ngModel)]="user.email"
            required
            email
            #email="ngModel"
          />
        </div>
        <div class="field-error" *ngIf="email.invalid && (email.dirty || email.touched)">
          <mat-icon>error_outline</mat-icon>
          <span *ngIf="email.errors?.['required']">Email is required.</span>
          <span *ngIf="email.errors?.['email']">Enter a valid email address.</span>
        </div>
      </div>

      <div class="field-group">
        <div class="label-row">
          <label class="field-label">Password</label>
          <a class="forgot-link" href="#">Forgot password?</a>
        </div>
        <div class="field-wrap">
          <mat-icon class="field-icon">lock</mat-icon>
          <input
            class="field-input"
            matInput
            type="password"
            placeholder="Enter your password"
            name="password"
            [(ngModel)]="user.password"
            required
            minlength="6"
            #password="ngModel"
          />
        </div>
        <div class="field-error" *ngIf="password.invalid && (password.dirty || password.touched)">
          <mat-icon>error_outline</mat-icon>
          <span *ngIf="password.errors?.['required']">Password is required.</span>
          <span *ngIf="password.errors?.['minlength']">Must be at least 6 characters.</span>
        </div>
      </div>

      <div class="card-divider"></div>

      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">
        Sign in
      </button>

      <p class="alt-link">
        Don't have an account? <a [routerLink]="['/register']">Register here</a>
      </p>

    </form>
  </div>
</div>

<app-page-layout
  title="Matches"
  subtitle="Match results and outcomes from recent competitions."
>
  <section class="matches-section">
    <div class="matches-header">
      <div>
        <h2 class="matches-title">Recent matches</h2>
        <p class="matches-subtitle">
          Fake data preview of how match cards look after creation.
        </p>
      </div>
      <button mat-flat-button color="primary" (click)="openAddResultDialog()">
        Add match result
      </button>
    </div>

    <div class="matches-grid">
      <mat-card class="match-card" *ngFor="let match of matchResults">
        <div class="match-card__header">
          <div>
            <div class="match-card__competition">{{ match.competition }}</div>
            <div class="match-card__date">
              {{ match.scheduledAt | date: 'MMM d, y' }}
            </div>
          </div>
          <span class="match-card__status" [ngClass]="getStatusClass(match.status)">
            {{ match.status }}
          </span>
        </div>
        <div class="match-card__players">
          <span>{{ match.playerOne }}</span>
          <span class="match-card__score">
            {{ match.scorePlayerOne }} - {{ match.scorePlayerTwo }}
          </span>
          <span>{{ match.playerTwo }}</span>
        </div>
        <div class="match-card__notes">{{ match.notes }}</div>
      </mat-card>
    </div>
  </section>
</app-page-layout>

<mat-drawer-container class="nav-container">
  <mat-drawer #drawer mode="side" opened class="drawer">

    <div class="sidebar-header">
      <div class="app-logo">
        <div class="logo-mark">
          <mat-icon>emoji_events</mat-icon>
        </div>
        <div class="app-title-block">
          <span class="app-name">Who's On Top</span>
          <span class="app-tagline">Competition Tracker</span>
        </div>
      </div>
    </div>

    <nav class="side-nav">
      <span class="nav-section-label">Menu</span>
      <a mat-button class="nav-item" [routerLink]="['']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <mat-icon>home</mat-icon>
        <span>Home</span>
      </a>
      <a mat-button class="nav-item" routerLinkActive="active">
        <mat-icon>sports_esports</mat-icon>
        <span>Competitions</span>
      </a>
      <a mat-button class="nav-item" [routerLink]="['leaderboard']" routerLinkActive="active">
        <mat-icon>leaderboard</mat-icon>
        <span>Leaderboard</span>
      </a>
      <a mat-button class="nav-item" [routerLink]="['matches']" routerLinkActive="active">
        <mat-icon>scoreboard</mat-icon>
        <span>Matches</span>
      </a>
      <a mat-button class="nav-item" routerLinkActive="active">
        <mat-icon>star</mat-icon>
        <span>Top Performers</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button mat-button class="user-row" [matMenuTriggerFor]="userMenu">
        <div class="user-avatar">MV</div>
        <div class="user-info">
          <span class="user-name">Mike V.</span>
          <span class="user-role">Administrator</span>
        </div>
        <mat-icon class="user-caret">more_horiz</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="onProfileClick()">
          <mat-icon>person</mat-icon> Profile
        </button>
        <button mat-menu-item (click)="onLogoutClick()">
          <mat-icon>logout</mat-icon> Logout
        </button>
      </mat-menu>
    </div>

  </mat-drawer>

  <mat-drawer-content>
    <mat-toolbar class="toolbar">

      <button mat-icon-button class="menu-toggle" (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="toolbar-spacer"></span>

      <button
        mat-icon-button
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="isDark ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        <mat-icon>{{ isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <button mat-icon-button class="toolbar-btn" style="position: relative">
        <mat-icon>notifications</mat-icon>
        <span class="notif-dot"></span>
      </button>

      <div class="toolbar-avatar" [matMenuTriggerFor]="profileMenu">MV</div>
      <mat-menu #profileMenu="matMenu">
        <button mat-menu-item (click)="onProfileClick()">
          <mat-icon>person</mat-icon> Profile
        </button>
        <button mat-menu-item (click)="onLogoutClick()">
          <mat-icon>logout</mat-icon> Logout
        </button>
      </mat-menu>

    </mat-toolbar>

    <div class="main-content">
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
